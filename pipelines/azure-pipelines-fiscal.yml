# Pipeline de la integracion Fiscal (consultas SET/DNIT + TURUC).
# Se dispara ante cambios en su proyecto o en el core compartido.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/integrations/fiscal/AxxonFiscal.Functions/**
      - src/core/**
      - pipelines/azure-pipelines-fiscal.yml
      - pipelines/templates/functionapp-build-deploy.yml
      - pipelines/templates/functionapp-deploy-stage.yml

extends:
  template: templates/functionapp-build-deploy.yml
  parameters:
    appBaseName: 'fa-axxonfiscal'
    projectPath: 'src/integrations/fiscal/AxxonFiscal.Functions/AxxonFiscal.Functions.csproj'
