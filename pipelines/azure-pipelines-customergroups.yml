# Pipeline de la integracion CustomerGroups.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/integrations/customers/AxxonCustomerGroups.Functions/**
      - src/core/**
      - pipelines/azure-pipelines-customergroups.yml
      - pipelines/templates/functionapp-build-deploy.yml
      - pipelines/templates/functionapp-deploy-stage.yml

extends:
  template: templates/functionapp-build-deploy.yml
  parameters:
    appBaseName: 'fa-axxoncustomergroups'
    projectPath: 'src/integrations/customers/AxxonCustomerGroups.Functions/AxxonCustomerGroups.Functions.csproj'
