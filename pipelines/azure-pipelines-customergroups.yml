# Pipeline targeted de la integracion CustomerGroups (redeploy de una sola app).
# Manual: elegir environmentName. El release completo usa azure-pipelines-release.yml.

trigger: none
pr: none

parameters:
  - name: environmentName
    type: string
    default: inte
    values:
      - inte
      - uat
      - prod

extends:
  template: templates/functionapp-build-deploy.yml
  parameters:
    appKey: customergroups
    appName: 'fa-axxoncustomergroups-${{ parameters.environmentName }}'
    projectPath: 'src/integrations/customers/AxxonCustomerGroups.Functions/AxxonCustomerGroups.Functions.csproj'
    azureServiceConnection: 'sc-chacomer-eip-${{ parameters.environmentName }}'
    environmentName: ${{ parameters.environmentName }}
