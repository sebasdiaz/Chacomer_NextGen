# Pipeline de la integracion Contacts.
# Se dispara ante cambios en su proyecto o en el core compartido.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/integrations/contacts/AxxonContacts.Functions/**
      - src/core/**
      - pipelines/azure-pipelines-contacts.yml
      - pipelines/templates/functionapp-build-deploy.yml
      - pipelines/templates/functionapp-deploy-stage.yml

extends:
  template: templates/functionapp-build-deploy.yml
  parameters:
    appBaseName: 'fa-axxoncontacts'
    projectPath: 'src/integrations/contacts/AxxonContacts.Functions/AxxonContacts.Functions.csproj'
