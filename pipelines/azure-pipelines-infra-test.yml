# ---------------------------------------------------------------------------
# Pipeline de infraestructura (TEST): despliega infra/main.bicep al resource
# group dataversetest. Corre validacion (what-if) y luego el deployment.
#
# Nota: dataversetest ya contiene recursos legacy hechos a mano
# (appinsightstest, keyvaultchacomertest). No colisionan con los que crea el
# Bicep (appi-eip-test, kv-chacomer-eip-test) y quedan fuera de este template.
#
# NOTA — sin tasks in-box:
#   El org de DevOps tiene deshabilitadas las built-in tasks (AzureCLI@2, etc.),
#   por eso NO se usa el task de Azure ni un Service Connection. La autenticacion
#   se hace con `az login --service-principal` sobre el az preinstalado del agente.
#
# Requiere:
#   - Environment 'test-infra' en DevOps (gate/aprobaciones).
#   - Estas VARIABLES del pipeline; azureClientSecretTest debe marcarse como SECRET:
#       azureClientIdTest, azureClientSecretTest, azureTenantId, azureSubscriptionIdTest
#   - El SP necesita Contributor + User Access Administrator sobre dataversetest
#     (las role assignments del Bicep requieren poder asignar roles).
# ---------------------------------------------------------------------------

# Manual: se corre a demanda para promover infra a TEST (Run pipeline).
trigger: none

variables:
  - name: environmentName
    value: 'test'
  - name: resourceGroupName
    value: 'dataversetest'

stages:
  - stage: Validate
    displayName: 'What-If'
    jobs:
      - job: WhatIf
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              az login --service-principal \
                -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" \
                --output none
              az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            displayName: 'az login (service principal)'
            env:
              AZURE_CLIENT_ID: $(azureClientIdTest)
              AZURE_CLIENT_SECRET: $(azureClientSecretTest)
              AZURE_TENANT_ID: $(azureTenantId)
              AZURE_SUBSCRIPTION_ID: $(azureSubscriptionIdTest)

          # Preflight: si el RG no existe o el SP no lo ve, ARM rechaza el what-if
          # con un 404/403 que az CLI muestra como "The content for this response
          # was already consumed" (bug conocido: consume el body del error antes
          # de formatearlo). Chequeamos aca para fallar con un mensaje entendible.
          - bash: |
              set -euo pipefail
              az account show --query '{subscription:name, subscriptionId:id, tenantId:tenantId}' -o table

              if ! az group show -n '$(resourceGroupName)' -o none 2>/dev/null; then
                echo "##vso[task.logissue type=error]El resource group '$(resourceGroupName)' no existe, o el service principal no tiene acceso a el en la suscripcion configurada en azureSubscriptionIdTest."
                exit 1
              fi
              az group show -n '$(resourceGroupName)' --query '{name:name, location:location}' -o table

              # main.bicep necesita estos RP registrados en la suscripcion.
              for rp in Microsoft.Web Microsoft.Storage Microsoft.KeyVault Microsoft.ServiceBus Microsoft.OperationalInsights Microsoft.Insights; do
                state=$(az provider show -n "$rp" --query registrationState -o tsv)
                echo "$rp: $state"
                if [ "$state" != "Registered" ]; then
                  echo "##vso[task.logissue type=warning]$rp no esta registrado en la suscripcion; el deployment va a fallar."
                fi
              done
            displayName: 'Preflight: suscripcion, RG y resource providers'

          - bash: |
              whatif() {
                az deployment group what-if \
                  --resource-group '$(resourceGroupName)' \
                  --template-file infra/main.bicep \
                  --parameters infra/environments/$(environmentName).bicepparam "$@"
              }
              if ! whatif; then
                echo '----- what-if fallo; reintento con --debug para ver la respuesta cruda de ARM -----'
                whatif --debug || true
                exit 1
              fi
            displayName: 'az deployment group what-if'

  - stage: Deploy
    displayName: 'Deploy infra'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployInfra
        pool:
          vmImage: 'ubuntu-latest'
        environment: '$(environmentName)-infra'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - bash: |
                    set -euo pipefail
                    az login --service-principal \
                      -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" \
                      --output none
                    az account set --subscription "$AZURE_SUBSCRIPTION_ID"
                  displayName: 'az login (service principal)'
                  env:
                    AZURE_CLIENT_ID: $(azureClientIdTest)
                    AZURE_CLIENT_SECRET: $(azureClientSecretTest)
                    AZURE_TENANT_ID: $(azureTenantId)
                    AZURE_SUBSCRIPTION_ID: $(azureSubscriptionIdTest)

                - bash: |
                    set -euo pipefail
                    az deployment group create \
                      --resource-group '$(resourceGroupName)' \
                      --template-file infra/main.bicep \
                      --parameters infra/environments/$(environmentName).bicepparam
                  displayName: 'az deployment group create'
