# ---------------------------------------------------------------------------
# Pipeline de infraestructura (TEST): despliega infra/main.bicep al resource
# group EiP_Test. Corre validacion (what-if) y luego el deployment.
#
# Requiere:
#   - Service connection ARM con permisos de Contributor + User Access
#     Administrator sobre el RG (las role assignments necesitan poder asignar roles).
#   - Environment 'test-infra' en DevOps (gate/aprobaciones).
# ---------------------------------------------------------------------------

# Manual: se corre a demanda para promover infra a TEST (Run pipeline).
trigger: none

variables:
  - name: azureServiceConnection
    value: 'sc-chacomer-eip-test'
  - name: environmentName
    value: 'test'
  - name: resourceGroupName
    value: 'EiP_Test'

stages:
  - stage: Validate
    displayName: 'What-If'
    jobs:
      - job: WhatIf
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'az deployment group what-if'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(resourceGroupName) \
                  --template-file infra/main.bicep \
                  --parameters infra/environments/$(environmentName).bicepparam

  - stage: Deploy
    displayName: 'Deploy infra'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployInfra
        pool:
          vmImage: 'ubuntu-latest'
        environment: '$(environmentName)-infra'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: 'az deployment group create'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az deployment group create \
                        --resource-group $(resourceGroupName) \
                        --template-file infra/main.bicep \
                        --parameters infra/environments/$(environmentName).bicepparam
