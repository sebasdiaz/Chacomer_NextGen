# ---------------------------------------------------------------------------
# Pipeline de infraestructura: despliega infra/main.bicep al resource group
# del ambiente. Corre validacion (what-if) y luego el deployment.
#
# Requiere:
#   - Service connection ARM con permisos de Contributor + User Access
#     Administrator sobre el RG (las role assignments necesitan poder asignar roles).
#   - Variable resourceGroupName por ambiente.
# ---------------------------------------------------------------------------

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**
      - pipelines/azure-pipelines-infra.yml

variables:
  - name: azureServiceConnection
    value: 'sc-chacomer-eip-inte'
  - name: environmentName
    value: 'inte'
  - name: resourceGroupName
    value: 'DataverseINTE'

stages:
  - stage: Validate
    displayName: 'What-If'
    jobs:
      - job: WhatIf
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'az deployment group what-if'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(resourceGroupName) \
                  --template-file infra/main.bicep \
                  --parameters infra/environments/$(environmentName).bicepparam

  - stage: Deploy
    displayName: 'Deploy infra'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployInfra
        pool:
          vmImage: 'ubuntu-latest'
        environment: '$(environmentName)-infra'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: 'az deployment group create'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az deployment group create \
                        --resource-group $(resourceGroupName) \
                        --template-file infra/main.bicep \
                        --parameters infra/environments/$(environmentName).bicepparam
