# ---------------------------------------------------------------------------
# Pipeline de infraestructura (INTE): despliega infra/main.bicep al resource
# group DataverseINTE. Corre validacion (what-if) y luego el deployment.
#
# OJO: DataverseINTE tiene 4 Function Apps vivas creadas a mano, con secretos
# en app settings planos y auth por connection string. Por eso inte.bicepparam
# va con deployFunctionApps = false: este pipeline administra hoy SOLO los
# recursos compartidos. Ver docs/wiki/plataforma/ambientes.md, "Cutover de INTE".
#
# NOTA — sin secretos:
#   `sc-chacomer-eip-inte` es de Workload Identity Federation y se consume con
#   AzureCLI@2. No hay client secret en variables del pipeline ni en Key Vault:
#   el task resuelve el token OIDC del job por su cuenta. Cada step que toca
#   Azure es su propio AzureCLI@2 — el login no sobrevive fuera del task.
#
# El SP de la SC necesita Contributor + User Access Administrator sobre
# DataverseINTE (las role assignments del Bicep requieren poder asignar roles),
# y la SC tiene que estar autorizada para este pipeline.
# ---------------------------------------------------------------------------

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**
      - pipelines/azure-pipelines-infra.yml

variables:
  - name: environmentName
    value: 'inte'
  - name: resourceGroupName
    value: 'DataverseINTE'
  # Service connection federada, por nombre: es lo que espera el input
  # `azureSubscription` de AzureCLI@2. La suscripcion sale de la propia SC.
  - name: azureServiceConnection
    value: 'sc-chacomer-eip-inte'

stages:
  - stage: Validate
    displayName: 'What-If'
    jobs:
      - job: WhatIf
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # Preflight: si el RG no existe o el SP no lo ve, ARM rechaza el what-if
          # con un 404/403 que az CLI muestra como "The content for this response
          # was already consumed" (bug conocido: consume el body del error antes
          # de formatearlo). Chequeamos aca para fallar con un mensaje entendible.
          - task: AzureCLI@2
            displayName: 'Preflight: suscripcion, RG y resource providers'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az account show --query '{subscription:name, subscriptionId:id, tenantId:tenantId}' -o table

                if ! az group show -n '$(resourceGroupName)' -o none 2>/dev/null; then
                  echo "##vso[task.logissue type=error]El resource group '$(resourceGroupName)' no existe, o el SP de $(azureServiceConnection) no tiene acceso a el."
                  exit 1
                fi
                az group show -n '$(resourceGroupName)' --query '{name:name, location:location}' -o table

                # main.bicep necesita estos RP registrados en la suscripcion.
                for rp in Microsoft.Web Microsoft.Storage Microsoft.KeyVault Microsoft.ServiceBus Microsoft.OperationalInsights Microsoft.Insights; do
                  state=$(az provider show -n "$rp" --query registrationState -o tsv)
                  echo "$rp: $state"
                  if [ "$state" != "Registered" ]; then
                    echo "##vso[task.logissue type=warning]$rp no esta registrado en la suscripcion; el deployment va a fallar."
                  fi
                done

          - task: AzureCLI@2
            displayName: 'az deployment group what-if'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                whatif() {
                  az deployment group what-if \
                    --resource-group '$(resourceGroupName)' \
                    --template-file infra/main.bicep \
                    --parameters infra/environments/$(environmentName).bicepparam "$@"
                }
                if ! whatif; then
                  echo '----- what-if fallo; reintento con --debug para ver la respuesta cruda de ARM -----'
                  whatif --debug || true
                  exit 1
                fi

  - stage: Deploy
    displayName: 'Deploy infra'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployInfra
        pool:
          vmImage: 'ubuntu-latest'
        environment: '$(environmentName)-infra'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'az deployment group create'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az deployment group create \
                        --resource-group '$(resourceGroupName)' \
                        --template-file infra/main.bicep \
                        --parameters infra/environments/$(environmentName).bicepparam
