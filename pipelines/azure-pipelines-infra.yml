# ---------------------------------------------------------------------------
# Pipeline de infraestructura (targeted). Despliega infra/main.bicep al RG del
# ambiente elegido. Manual: elegir environmentName al ejecutar.
#
# El flujo de release automatico (sprint close) usa azure-pipelines-release.yml.
#
# Requiere en el DevOps del cliente:
#   - Service connection ARM 'sc-chacomer-eip-{env}' con Contributor +
#     User Access Administrator sobre el RG (las role assignments asignan roles).
#   - Environment '{env}-infra' con approval gate.
# ---------------------------------------------------------------------------

trigger: none
pr: none

parameters:
  - name: environmentName
    type: string
    default: inte
    values:
      - inte
      - uat
      - prod

variables:
  - template: vars/env-config.yml
    parameters:
      environmentName: ${{ parameters.environmentName }}

extends:
  template: templates/infra-deploy.yml
  parameters:
    environmentName: ${{ parameters.environmentName }}
    azureServiceConnection: 'sc-chacomer-eip-${{ parameters.environmentName }}'
    resourceGroupName: $(resourceGroupName)
