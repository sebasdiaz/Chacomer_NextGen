# ---------------------------------------------------------------------------
# Pipeline de infraestructura (INTE): despliega infra/main.bicep al resource
# group EiP_Inte. Corre validacion (what-if) y luego el deployment.
#
# NOTA — sin tasks in-box:
#   El org de DevOps tiene deshabilitadas las built-in tasks (AzureCLI@2, etc.),
#   por eso NO se usa el task de Azure ni un Service Connection. La autenticacion
#   se hace con `az login --service-principal` sobre el az preinstalado del agente.
#
# Requiere estas VARIABLES del pipeline (definirlas en Edit -> Variables, o en un
# variable group); azureClientSecret debe marcarse como SECRET:
#   - azureClientId        (appId del SP)
#   - azureClientSecret    (SECRET — password del SP)
#   - azureTenantId
#   - azureSubscriptionId
#
# El SP necesita Contributor + User Access Administrator sobre EiP_Inte
# (las role assignments del Bicep requieren poder asignar roles).
# ---------------------------------------------------------------------------

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**
      - pipelines/azure-pipelines-infra.yml

variables:
  - name: environmentName
    value: 'inte'
  - name: resourceGroupName
    value: 'EiP_Inte'

stages:
  - stage: Validate
    displayName: 'What-If'
    jobs:
      - job: WhatIf
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              az login --service-principal \
                -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" \
                --output none
              az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            displayName: 'az login (service principal)'
            env:
              AZURE_CLIENT_ID: $(azureClientId)
              AZURE_CLIENT_SECRET: $(azureClientSecret)
              AZURE_TENANT_ID: $(azureTenantId)
              AZURE_SUBSCRIPTION_ID: $(azureSubscriptionId)
          - bash: |
              set -euo pipefail
              az deployment group what-if \
                --resource-group "$(resourceGroupName)" \
                --template-file infra/main.bicep \
                --parameters infra/environments/$(environmentName).bicepparam
            displayName: 'az deployment group what-if'

  - stage: Deploy
    displayName: 'Deploy infra'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployInfra
        pool:
          vmImage: 'ubuntu-latest'
        environment: '$(environmentName)-infra'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - bash: |
                    set -euo pipefail
                    az login --service-principal \
                      -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" \
                      --output none
                    az account set --subscription "$AZURE_SUBSCRIPTION_ID"
                  displayName: 'az login (service principal)'
                  env:
                    AZURE_CLIENT_ID: $(azureClientId)
                    AZURE_CLIENT_SECRET: $(azureClientSecret)
                    AZURE_TENANT_ID: $(azureTenantId)
                    AZURE_SUBSCRIPTION_ID: $(azureSubscriptionId)
                - bash: |
                    set -euo pipefail
                    az deployment group create \
                      --resource-group "$(resourceGroupName)" \
                      --template-file infra/main.bicep \
                      --parameters infra/environments/$(environmentName).bicepparam
                  displayName: 'az deployment group create'
