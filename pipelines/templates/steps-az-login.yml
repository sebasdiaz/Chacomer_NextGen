# ---------------------------------------------------------------------------
# Steps: `az login` contra una service connection de Workload Identity
# Federation, SIN usar AzureCLI@2 (el org tiene deshabilitadas las tasks in-box).
#
# No hay secreto en ninguna parte: ni en variables del pipeline, ni en Key Vault.
# La SC es federada, asi que Azure DevOps puede emitir un token OIDC de vida corta
# para el job actual; ese token se canjea por un token de Azure via
# `az login --federated-token`. El clientId / tenantId / subscriptionId NO son
# secretos (son identificadores publicos), por eso viajan como parametros.
#
# REQUISITO: la service connection tiene que estar autorizada para el pipeline.
# Si el primer run falla con 401/403 al pedir el oidctoken, ir a
# Project settings -> Service connections -> <SC> -> Security y agregar el
# pipeline (o marcar "Grant access permission to all pipelines").
# ---------------------------------------------------------------------------

parameters:
  - name: serviceConnectionId  # GUID de la service connection (no es secreto)
    type: string
  - name: clientId             # appId del SP federado detras de la SC
    type: string
  - name: tenantId
    type: string
  - name: subscriptionId
    type: string
  - name: displayName
    type: string
    default: 'az login (workload identity federation)'

steps:
  - bash: |
      set -euo pipefail

      url="${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_apis/distributedtask/hubs/build/plans/${SYSTEM_PLANID}/jobs/${SYSTEM_JOBID}/oidctoken?api-version=7.1-preview.1&serviceConnectionId=${SERVICE_CONNECTION_ID}"
      echo "Pidiendo token OIDC para la service connection ${SERVICE_CONNECTION_ID}"

      # SIN -f: con -f curl aborta ante un error HTTP y descarta el body, que es
      # justo donde Azure DevOps explica que paso. Se captura status y body por
      # separado. El body se imprime SOLO si fallo: en el caso exitoso contiene
      # el token.
      resp="$(mktemp)"
      http=$(curl -sS -o "$resp" -w '%{http_code}' --request POST \
        --header "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        --header "Content-Type: application/json" \
        --data '' \
        "$url" || echo "000")

      if [ "$http" != "200" ]; then
        echo "##vso[task.logissue type=error]El pedido del token OIDC devolvio HTTP ${http}."
        echo "--- respuesta de Azure DevOps ---"
        head -c 2000 "$resp"; echo
        echo "--- contexto ---"
        echo "  collectionUri : ${SYSTEM_COLLECTIONURI}"
        echo "  projectId     : ${SYSTEM_TEAMPROJECTID}"
        echo "  planId        : ${SYSTEM_PLANID}"
        echo "  jobId         : ${SYSTEM_JOBID}"
        echo "  serviceConnId : ${SERVICE_CONNECTION_ID}"
        echo "401/403 => el pipeline no esta autorizado a usar la service connection."
        echo "400      => request mal formado, o la SC no es de workload identity federation."
        rm -f "$resp"
        exit 1
      fi

      oidc=$(jq -r '.oidcToken // empty' < "$resp")
      rm -f "$resp"

      if [ -z "$oidc" ]; then
        echo "##vso[task.logissue type=error]Azure DevOps respondio 200 pero sin campo oidcToken."
        exit 1
      fi

      az login --service-principal \
        -u "$AZURE_CLIENT_ID" \
        --tenant "$AZURE_TENANT_ID" \
        --federated-token "$oidc" \
        --output none
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      az account show --query '{subscription:name, subscriptionId:id, tenantId:tenantId}' -o table
    displayName: ${{ parameters.displayName }}
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      SYSTEM_COLLECTIONURI: $(System.CollectionUri)
      SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
      SYSTEM_PLANID: $(System.PlanId)
      SYSTEM_JOBID: $(System.JobId)
      SERVICE_CONNECTION_ID: ${{ parameters.serviceConnectionId }}
      AZURE_CLIENT_ID: ${{ parameters.clientId }}
      AZURE_TENANT_ID: ${{ parameters.tenantId }}
      AZURE_SUBSCRIPTION_ID: ${{ parameters.subscriptionId }}
