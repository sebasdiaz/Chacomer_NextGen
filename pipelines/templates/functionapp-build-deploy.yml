# ---------------------------------------------------------------------------
# Template compartido: build + promocion de una Function App de la EiP.
# Reutilizado por cada pipeline de integracion (contacts, customers, ...).
#
# Build: dotnet publish del proyecto (arrastra Axxon.Eip.Core por ProjectReference).
# Deploy: un stage por ambiente, en cadena INTE -> TEST. Se compila una sola vez
#         y se promueve el mismo artifact; el gate a TEST es el approval del
#         environment 'test' en Azure DevOps.
#
# El nombre de la Function App se arma como {appBaseName}-{env}, que es la
# convencion de infra/main.bicep (fa-axxon{dominio}-{env}).
# ---------------------------------------------------------------------------

parameters:
  - name: appBaseName        # Nombre de la app SIN sufijo de ambiente (ej: fa-axxoncontacts)
    type: string
  - name: projectPath        # Ruta al .csproj de la Function App
    type: string
  - name: testProjectPath    # Ruta al .csproj de tests. Vacio = la integracion no tiene
    type: string
    default: ''
  - name: deployToInte       # false si la app todavia no existe en INTE
    type: boolean
    default: true
  - name: deployToTest       # false para dejar una integracion fuera de la promocion a TEST
    type: boolean
    default: true
  # Overrides de nombre. Vacio = {appBaseName}-{env}. Sirven para los ambientes
  # cuya app se creo a mano con otro nombre que el que genera main.bicep.
  - name: inteAppName
    type: string
    default: ''
  - name: testAppName
    type: string
    default: ''
  - name: inteServiceConnection
    type: string
    default: 'sc-chacomer-eip-inte'
  - name: testServiceConnection
    type: string
    default: 'sc-chacomer-eip-test'
  - name: dotnetVersion
    type: string
    default: '10.0.x'
  - name: buildConfiguration
    type: string
    default: 'Release'

stages:
  - stage: Build
    displayName: 'Build ${{ parameters.appBaseName }}'
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK ${{ parameters.dotnetVersion }}'
            inputs:
              packageType: 'sdk'
              version: ${{ parameters.dotnetVersion }}

          # Antes del publish: si los tests caen, no se genera artifact.
          - ${{ if ne(parameters.testProjectPath, '') }}:
            - task: DotNetCoreCLI@2
              displayName: 'dotnet test'
              inputs:
                command: 'test'
                projects: '${{ parameters.testProjectPath }}'
                arguments: '-c ${{ parameters.buildConfiguration }} --logger trx --results-directory $(Agent.TempDirectory)/testresults'
                publishTestResults: true

          - task: DotNetCoreCLI@2
            displayName: 'dotnet publish'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '${{ parameters.projectPath }}'
              arguments: '-c ${{ parameters.buildConfiguration }} -o $(Build.ArtifactStagingDirectory)/publish'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
              ArtifactName: 'functionapp'

  - ${{ if parameters.deployToInte }}:
    - template: functionapp-deploy-stage.yml
      parameters:
        stageName: 'Deploy_inte'
        dependsOn: 'Build'
        ${{ if ne(parameters.inteAppName, '') }}:
          appName: ${{ parameters.inteAppName }}
        ${{ else }}:
          appName: '${{ parameters.appBaseName }}-inte'
        environmentName: 'inte'
        azureServiceConnection: ${{ parameters.inteServiceConnection }}

  - ${{ if parameters.deployToTest }}:
    - template: functionapp-deploy-stage.yml
      parameters:
        stageName: 'Deploy_test'
        # Si la integracion no pasa por INTE, TEST cuelga directo de Build.
        ${{ if parameters.deployToInte }}:
          dependsOn: 'Deploy_inte'
        ${{ else }}:
          dependsOn: 'Build'
        ${{ if ne(parameters.testAppName, '') }}:
          appName: ${{ parameters.testAppName }}
        ${{ else }}:
          appName: '${{ parameters.appBaseName }}-test'
        environmentName: 'test'
        azureServiceConnection: ${{ parameters.testServiceConnection }}
