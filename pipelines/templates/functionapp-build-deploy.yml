# ---------------------------------------------------------------------------
# Template compartido: build + promocion de una Function App de la EiP.
# Reutilizado por cada pipeline de integracion (contacts, customers, ...).
#
# Build: dotnet publish del proyecto (arrastra Axxon.Eip.Core por ProjectReference).
# Deploy: un stage por ambiente, en cadena INTE -> TEST. Se compila una sola vez
#         y se promueve el mismo artifact; el gate a TEST es el approval del
#         environment 'test' en Azure DevOps.
#
# El nombre de la Function App se arma como {appBaseName}-{env}, que es la
# convencion de infra/main.bicep (fa-axxon{dominio}-{env}).
#
# NOTA — el build no usa tasks in-box:
#   El SDK se instala con dotnet-install.sh y el artifact se publica con el
#   logging command ##vso[artifact.upload]. Viene de cuando se creia que el org
#   tenia deshabilitadas las built-in tasks; no es asi (ver el stage de deploy,
#   que si usa AzureCLI@2). Funciona y esta probado, pero se puede volver a
#   UseDotNet@2 / DotNetCoreCLI@2 / PublishBuildArtifacts@1 cuando convenga.
#
# NO hay secretos: el login del deploy sale de la service connection federada
# del ambiente, via AzureCLI@2. El SP de cada SC necesita Contributor sobre el
# RG del ambiente, y la SC tiene que estar autorizada para el pipeline.
# ---------------------------------------------------------------------------

parameters:
  - name: appBaseName        # Nombre de la app SIN sufijo de ambiente (ej: fa-axxoncontacts)
    type: string
  - name: projectPath        # Ruta al .csproj de la Function App
    type: string
  - name: testProjectPath    # Ruta al .csproj de tests. Vacio = la integracion no tiene
    type: string
    default: ''
  - name: deployToInte       # false si la app todavia no existe en INTE
    type: boolean
    default: true
  - name: deployToTest       # false para dejar una integracion fuera de la promocion a TEST
    type: boolean
    default: true
  # Overrides de nombre. Vacio = {appBaseName}-{env}. Sirven para los ambientes
  # cuya app se creo a mano con otro nombre que el que genera main.bicep.
  - name: inteAppName
    type: string
    default: ''
  - name: testAppName
    type: string
    default: ''
  # Resource group de cada ambiente: hace falta explicito porque
  # `az functionapp deployment source config-zip` lo pide (el task no lo pedia).
  - name: inteResourceGroup
    type: string
    default: 'DataverseINTE'
  - name: testResourceGroup
    type: string
    default: 'dataversetest'
  # Service connections federadas por ambiente. Van por nombre: es lo que espera
  # el input `azureSubscription` de AzureCLI@2, y es esa referencia la que
  # habilita a DevOps a emitir el token OIDC para el stage.
  - name: inteServiceConnection
    type: string
    default: 'sc-chacomer-eip-inte'
  - name: testServiceConnection
    type: string
    default: 'sc-chacomer-eip-test'
  - name: dotnetChannel      # Canal de dotnet-install.sh, no una version exacta
    type: string
    default: '10.0'
  - name: buildConfiguration
    type: string
    default: 'Release'

stages:
  - stage: Build
    displayName: 'Build ${{ parameters.appBaseName }}'
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              curl -sSfL https://dot.net/v1/dotnet-install.sh -o "$AGENT_TEMPDIRECTORY/dotnet-install.sh"
              bash "$AGENT_TEMPDIRECTORY/dotnet-install.sh" \
                --channel '${{ parameters.dotnetChannel }}' --install-dir "$HOME/.dotnet" --no-path
              echo "##vso[task.prependpath]$HOME/.dotnet"
              "$HOME/.dotnet/dotnet" --info
            displayName: 'Instalar .NET SDK ${{ parameters.dotnetChannel }}'
            env:
              AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
              DOTNET_CLI_TELEMETRY_OPTOUT: '1'

          # Antes del publish: si los tests caen, no se genera artifact.
          - ${{ if ne(parameters.testProjectPath, '') }}:
            - bash: |
                set -euo pipefail
                dotnet test '${{ parameters.testProjectPath }}' \
                  -c '${{ parameters.buildConfiguration }}' \
                  --logger trx --results-directory "$AGENT_TEMPDIRECTORY/testresults"
              displayName: 'dotnet test'
              env:
                AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

            # PublishTestResults@2 tambien es in-box; el logging command hace lo mismo.
            - bash: |
                set -euo pipefail
                trx=$(find "$AGENT_TEMPDIRECTORY/testresults" -name '*.trx' 2>/dev/null | paste -sd, -)
                if [ -n "$trx" ]; then
                  echo "##vso[results.publish type=VSTest;mergeResults=true;resultFiles=$trx;]"
                else
                  echo "Sin archivos .trx que publicar."
                fi
              displayName: 'Publicar resultados de tests'
              condition: succeededOrFailed()
              env:
                AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

          # Flex Consumption (One Deploy) espera un zip con el CONTENIDO del
          # directorio de publish en la raiz, no una carpeta contenedora.
          - bash: |
              set -euo pipefail
              rm -rf "$BUILD_ARTIFACTSTAGINGDIRECTORY/publish" "$BUILD_ARTIFACTSTAGINGDIRECTORY/functionapp.zip"
              dotnet publish '${{ parameters.projectPath }}' \
                -c '${{ parameters.buildConfiguration }}' \
                -o "$BUILD_ARTIFACTSTAGINGDIRECTORY/publish"
              ( cd "$BUILD_ARTIFACTSTAGINGDIRECTORY/publish" && zip -r -q "$BUILD_ARTIFACTSTAGINGDIRECTORY/functionapp.zip" . )
              ls -lh "$BUILD_ARTIFACTSTAGINGDIRECTORY/functionapp.zip"
            displayName: 'dotnet publish + zip'
            env:
              BUILD_ARTIFACTSTAGINGDIRECTORY: $(Build.ArtifactStagingDirectory)

          - bash: |
              echo "##vso[artifact.upload containerfolder=functionapp;artifactname=functionapp]$BUILD_ARTIFACTSTAGINGDIRECTORY/functionapp.zip"
            displayName: 'Publicar artifact'
            env:
              BUILD_ARTIFACTSTAGINGDIRECTORY: $(Build.ArtifactStagingDirectory)

  - ${{ if parameters.deployToInte }}:
    - template: functionapp-deploy-stage.yml
      parameters:
        stageName: 'Deploy_inte'
        dependsOn: 'Build'
        ${{ if ne(parameters.inteAppName, '') }}:
          appName: ${{ parameters.inteAppName }}
        ${{ else }}:
          appName: '${{ parameters.appBaseName }}-inte'
        environmentName: 'inte'
        resourceGroupName: ${{ parameters.inteResourceGroup }}
        azureServiceConnection: ${{ parameters.inteServiceConnection }}

  - ${{ if parameters.deployToTest }}:
    - template: functionapp-deploy-stage.yml
      parameters:
        stageName: 'Deploy_test'
        # Si la integracion no pasa por INTE, TEST cuelga directo de Build.
        ${{ if parameters.deployToInte }}:
          dependsOn: 'Deploy_inte'
        ${{ else }}:
          dependsOn: 'Build'
        ${{ if ne(parameters.testAppName, '') }}:
          appName: ${{ parameters.testAppName }}
        ${{ else }}:
          appName: '${{ parameters.appBaseName }}-test'
        environmentName: 'test'
        resourceGroupName: ${{ parameters.testResourceGroup }}
        azureServiceConnection: ${{ parameters.testServiceConnection }}
