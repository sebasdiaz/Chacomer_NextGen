# ---------------------------------------------------------------------------
# Template compartido: build + deploy de una Function App de la EiP.
# Reutilizado por cada pipeline de integracion y por el pipeline de release.
#
# Build: dotnet publish del proyecto (arrastra Axxon.Eip.Core por ProjectReference).
# Deploy: AzureFunctionApp@2 (Flex Consumption / Linux) via service connection.
#
# appKey hace unicos los nombres de stage cuando el template se instancia varias
# veces en un mismo pipeline (release de las 4 apps).
# ---------------------------------------------------------------------------

parameters:
  - name: appKey             # Clave corta para nombres de stage (contacts, customers, ...)
    type: string
  - name: appName            # Nombre de la Function App en Azure (ej: fa-axxoncontacts-inte)
    type: string
  - name: projectPath        # Ruta al .csproj de la Function App
    type: string
  - name: azureServiceConnection  # Service connection de Azure DevOps (ARM)
    type: string
  - name: environmentName    # Ambiente de Azure DevOps (para approvals/gates)
    type: string
  - name: extraDeployDependsOn    # stages adicionales de las que depende Deploy (ej: infra)
    type: object
    default: []
  - name: dotnetVersion
    type: string
    default: '10.0.x'
  - name: buildConfiguration
    type: string
    default: 'Release'

stages:
  - stage: Build_${{ parameters.appKey }}
    displayName: 'Build ${{ parameters.appName }}'
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK ${{ parameters.dotnetVersion }}'
            inputs:
              packageType: 'sdk'
              version: ${{ parameters.dotnetVersion }}

          - task: DotNetCoreCLI@2
            displayName: 'dotnet publish'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '${{ parameters.projectPath }}'
              arguments: '-c ${{ parameters.buildConfiguration }} -o $(Build.ArtifactStagingDirectory)/publish'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
              ArtifactName: 'functionapp-${{ parameters.appKey }}'

  - stage: Deploy_${{ parameters.appKey }}
    displayName: 'Deploy ${{ parameters.appName }}'
    dependsOn:
      - Build_${{ parameters.appKey }}
      - ${{ each dep in parameters.extraDeployDependsOn }}:
          - ${{ dep }}
    condition: succeeded()
    jobs:
      - deployment: Deploy
        pool:
          vmImage: 'ubuntu-latest'
        environment: ${{ parameters.environmentName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: functionapp-${{ parameters.appKey }}

                - task: AzureFunctionApp@2
                  displayName: 'Deploy a ${{ parameters.appName }}'
                  inputs:
                    connectedServiceNameARM: ${{ parameters.azureServiceConnection }}
                    appType: 'functionAppLinux'
                    appName: ${{ parameters.appName }}
                    package: '$(Pipeline.Workspace)/functionapp-${{ parameters.appKey }}/**/*.zip'
                    deploymentMethod: 'auto'
