# ---------------------------------------------------------------------------
# Template de un stage de deploy: publica el artifact de Build en la Function
# App del ambiente indicado. Lo usa functionapp-build-deploy.yml una vez por
# ambiente de la cadena de promocion (inte -> test).
#
# El artifact se construye UNA sola vez (stage Build) y se promueve tal cual:
# el binario que se valida en INTE es exactamente el que llega a TEST.
#
# El artifact se baja por la REST API de builds con $(System.AccessToken) (es el
# par de `##vso[artifact.upload]` que usa el stage de Build), y el deploy va por
# az CLI: `config-zip` es el camino soportado para Flex Consumption / One Deploy.
#
# El login a Azure lo hace AzureCLI@2 con la service connection federada del
# ambiente. No hay secretos: la SC es de Workload Identity Federation y el task
# resuelve el token OIDC por su cuenta. Es ademas la UNICA forma de consumirla:
# Azure DevOps solo emite el token si el stage referencia la SC explicitamente
# con un input de tipo connectedService, que es lo que hace `azureSubscription`.
# ---------------------------------------------------------------------------

parameters:
  - name: stageName        # Nombre del stage (debe ser unico en el pipeline)
    type: string
  - name: dependsOn        # Stage previo de la cadena de promocion
    type: string
  - name: appName          # Nombre de la Function App en Azure
    type: string
  - name: environmentName  # Environment de Azure DevOps (approvals/gates)
    type: string
  - name: resourceGroupName
    type: string
  - name: azureServiceConnection  # Nombre de la service connection del ambiente
    type: string
  # Funcion a verificar en el host despues del deploy. Vacio = sin smoke test.
  - name: smokeTestFunctionName
    type: string
    default: ''

stages:
  - stage: ${{ parameters.stageName }}
    displayName: 'Deploy ${{ parameters.appName }}'
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    jobs:
      - deployment: Deploy
        pool:
          vmImage: 'ubuntu-latest'
        environment: ${{ parameters.environmentName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - bash: |
                    set -euo pipefail
                    dest="$AGENT_TEMPDIRECTORY/artifact"
                    rm -rf "$dest"; mkdir -p "$dest"

                    # $format=zip devuelve el container completo: functionapp/functionapp.zip
                    curl -sSfL \
                      -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
                      "${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_apis/build/builds/${BUILD_BUILDID}/artifacts?artifactName=functionapp&api-version=7.1&%24format=zip" \
                      -o "$AGENT_TEMPDIRECTORY/artifact.zip"
                    unzip -q -o "$AGENT_TEMPDIRECTORY/artifact.zip" -d "$dest"

                    pkg=$(find "$dest" -name '*.zip' | head -n1)
                    if [ -z "$pkg" ]; then
                      echo "##vso[task.logissue type=error]No se encontro el paquete .zip dentro del artifact 'functionapp'."
                      exit 1
                    fi
                    echo "$pkg" > "$AGENT_TEMPDIRECTORY/pkg-path"
                    ls -lh "$pkg"
                  displayName: 'Descargar artifact functionapp'
                  env:
                    AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    SYSTEM_COLLECTIONURI: $(System.CollectionUri)
                    SYSTEM_TEAMPROJECTID: $(System.TeamProjectId)
                    BUILD_BUILDID: $(Build.BuildId)

                - task: AzureCLI@2
                  displayName: 'Deploy a ${{ parameters.appName }}'
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      pkg=$(cat "$AGENT_TEMPDIRECTORY/pkg-path")

                      if ! az functionapp show -g '${{ parameters.resourceGroupName }}' -n '${{ parameters.appName }}' -o none 2>/dev/null; then
                        echo "##vso[task.logissue type=error]La Function App '${{ parameters.appName }}' no existe en el resource group '${{ parameters.resourceGroupName }}', o el service principal de ${{ parameters.azureServiceConnection }} no tiene acceso."
                        exit 1
                      fi

                      az functionapp deployment source config-zip \
                        -g '${{ parameters.resourceGroupName }}' \
                        -n '${{ parameters.appName }}' \
                        --src "$pkg"
                  env:
                    AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

                # Un config-zip puede terminar "exitoso" sin que el host llegue a cargar
                # nada (paquete mal armado, worker que no levanta). Preguntarle al host si
                # la funcion existe es lo unico que distingue un deploy real de uno vacio.
                - ${{ if ne(parameters.smokeTestFunctionName, '') }}:
                  - task: AzureCLI@2
                    displayName: 'Smoke test: ${{ parameters.smokeTestFunctionName }} registrada en el host'
                    inputs:
                      azureSubscription: ${{ parameters.azureServiceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail

                        # El host reindexa las funciones despues del deploy: no es inmediato.
                        for intento in 1 2 3 4 5 6; do
                          if az functionapp function show -g '${{ parameters.resourceGroupName }}' -n '${{ parameters.appName }}' --function-name '${{ parameters.smokeTestFunctionName }}' -o none 2>/dev/null; then
                            echo "La funcion '${{ parameters.smokeTestFunctionName }}' esta registrada."
                            exit 0
                          fi
                          echo "Intento $intento: todavia no aparece. Reintentando en 20s..."
                          sleep 20
                        done

                        echo "##vso[task.logissue type=error]La funcion '${{ parameters.smokeTestFunctionName }}' no quedo registrada en '${{ parameters.appName }}'. El deploy no subio nada utilizable."
                        exit 1
