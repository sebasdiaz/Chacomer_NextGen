# Pipeline de la integracion Products.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/integrations/products/AxxonProducts.Functions/**
      - src/core/**
      - pipelines/azure-pipelines-products.yml
      - pipelines/templates/functionapp-build-deploy.yml
      - pipelines/templates/functionapp-deploy-stage.yml

extends:
  template: templates/functionapp-build-deploy.yml
  parameters:
    appBaseName: 'fa-axxonproducts'
    projectPath: 'src/integrations/products/AxxonProducts.Functions/AxxonProducts.Functions.csproj'
